# Default config: a generic worker name for people deploying their own copy.
# Locking it down is done with the PROXY_TOKENS secret (see README.md); with
# neither PROXY_TOKENS nor PUBLIC set, the worker serves a setup page and
# refuses to proxy anything.
name = "savr-cors-proxy"
main = "worker.js"
compatibility_date = "2023-08-23"

# A public proxy should not expose extra per-version preview endpoints.
preview_urls = false

# Keep the invocation logs the app's incident analysis relied on. The worker
# itself only logs errors now (host, never the full target URL).
[observability]
enabled = true

# The shared public instance: open (no token required), under its historical
# name. Deploy with `npx wrangler deploy --env public`.
[env.public]
name = "lively-cors-proxy-b569"

[env.public.vars]
PUBLIC = "true"
# Only these calling sites may use the shared instance: production, Netlify
# preview/branch deploys, and local dev. Self-hosted Savr frontends should run
# their own proxy. Restricts callers only — any public article host can still
# be fetched. Syntax: README.md "Origin allowlist".
ALLOWED_ORIGINS = "https://savr.link,https://*--savrlist.netlify.app,http://localhost:*,http://127.0.0.1:*"

# Usage statistics, shared public instance only: one Analytics Engine point per
# recorded request, read and displayed by the separate stats worker
# (infra/cors-stats; see its README). Self-hosted deploys get no binding, so
# they write nothing.
[[env.public.analytics_engine_datasets]]
binding = "STATS"
dataset = "savr_cors_stats"
