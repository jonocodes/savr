<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Savr options</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <main class="panel wide">
      <h1>Savr</h1>
      <form id="options-form">
        <label for="app-url">Savr address</label>
        <input
          id="app-url"
          type="url"
          inputmode="url"
          placeholder="https://savr.link"
          required
        />
        <p class="hint">
          Point this at your own Savr if you self-host (for example
          <code>http://localhost:3000</code>). Granting access to that address
          may be required the first time.
        </p>
        <button type="submit">Save</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <footer class="links">
        <a href="https://github.com/jonocodes/savr" target="_blank" rel="noopener noreferrer">
          Savr is open source — project and issues on GitHub
        </a>
      </footer>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
