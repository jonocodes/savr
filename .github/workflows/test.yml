name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm run test

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Remove Google Chrome apt source
        # The ubuntu-latest image ships a dl.google.com chrome-stable apt source
        # that intermittently serves a corrupt Packages.gz (hash-sum mismatch),
        # which fails the whole `apt-get update` that `--with-deps` runs. We only
        # need Playwright's bundled Chromium (from Ubuntu repos), so drop it.
        run: sudo rm -f /etc/apt/sources.list.d/google-chrome*.list
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
      - name: Smoke tests
        run: npx playwright test tests/e2e/smoke.spec.ts
        env:
          CI: true
